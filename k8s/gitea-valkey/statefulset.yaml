# StatefulSet Valkey corrige : nodes.conf sur un PVC au lieu d'un emptyDir.
# Sans cela, chaque recreation de pod fait perdre l'identite de cluster du
# noeud et casse Gitea (voir k8s/RUNBOOK-valkey.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    meta.helm.sh/release-name: gitea
    meta.helm.sh/release-namespace: gitea
  labels:
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: valkey-cluster
    app.kubernetes.io/version: 8.1.3
    helm.sh/chart: valkey-cluster-3.0.24
  name: gitea-valkey-cluster
  namespace: gitea
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: gitea
      app.kubernetes.io/name: valkey-cluster
  serviceName: gitea-valkey-cluster-headless
  template:
    metadata:
      annotations:
        checksum/config: 44b880d412d2f853a66bc0756866832dd2b196116f3111287e80268bbbc0101e
        checksum/scripts: 4ee896f8ae3b27edce6103912f6275663ad54c3227db77aeb84d43e8676b252f
        checksum/secret: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        kubectl.kubernetes.io/restartedAt: '2026-08-08T19:49:46Z'
      labels:
        app.kubernetes.io/instance: gitea
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: valkey-cluster
        app.kubernetes.io/version: 8.1.3
        helm.sh/chart: valkey-cluster-3.0.24
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: gitea
                  app.kubernetes.io/name: valkey-cluster
              topologyKey: kubernetes.io/hostname
            weight: 1
      automountServiceAccountToken: false
      containers:
      - args:
        - "# Backwards compatibility change\nif ! [[ -f /opt/bitnami/valkey/etc/valkey.conf\
          \ ]]; then\n    echo COPYING FILE\n    cp  /opt/bitnami/valkey/etc/valkey-default.conf\
          \ /opt/bitnami/valkey/etc/valkey.conf\nfi\npod_index=($(echo \"$POD_NAME\"\
          \ | tr \"-\" \"\\n\"))\npod_index=\"${pod_index[-1]}\"\nif [[ \"$pod_index\"\
          \ == \"0\" ]]; then\n  export VALKEY_CLUSTER_CREATOR=\"yes\"\n  export VALKEY_CLUSTER_REPLICAS=\"\
          0\"\nfi\n/opt/bitnami/scripts/valkey-cluster/entrypoint.sh /opt/bitnami/scripts/valkey-cluster/run.sh\n"
        command:
        - /bin/bash
        - -c
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: VALKEY_NODES
          value: 'gitea-valkey-cluster-0.gitea-valkey-cluster-headless gitea-valkey-cluster-1.gitea-valkey-cluster-headless
            gitea-valkey-cluster-2.gitea-valkey-cluster-headless '
        - name: ALLOW_EMPTY_PASSWORD
          value: 'yes'
        - name: VALKEY_AOF_ENABLED
          value: 'yes'
        - name: VALKEY_TLS_ENABLED
          value: 'no'
        - name: VALKEY_PORT_NUMBER
          value: '6379'
        image: docker.io/bitnamilegacy/valkey-cluster:8.1.3-debian-12-r3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - /scripts/ping_liveness_local.sh 5
          failureThreshold: 5
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 6
        name: gitea-valkey-cluster
        ports:
        - containerPort: 6379
          name: tcp-redis
          protocol: TCP
        - containerPort: 16379
          name: tcp-redis-bus
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - /scripts/ping_readiness_local.sh 1
          failureThreshold: 5
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 150m
            ephemeral-storage: 2Gi
            memory: 192Mi
          requests:
            cpu: 100m
            ephemeral-storage: 50Mi
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 1001
          runAsNonRoot: true
          runAsUser: 1001
          seLinuxOptions: {}
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /scripts
          name: scripts
        - mountPath: /bitnami/valkey/data
          name: valkey-data
        - mountPath: /opt/bitnami/valkey/etc/valkey-default.conf
          name: default-config
          subPath: valkey-default.conf
        - mountPath: /opt/bitnami/valkey/etc/
          name: empty-dir
          subPath: app-conf-dir
        - mountPath: /opt/bitnami/valkey/tmp
          name: empty-dir
          subPath: app-tmp-dir
        - mountPath: /opt/bitnami/valkey/logs
          name: empty-dir
          subPath: app-logs-dir
        - mountPath: /tmp
          name: empty-dir
          subPath: tmp-dir
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
      serviceAccount: gitea-valkey-cluster
      serviceAccountName: gitea-valkey-cluster
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 493
          name: gitea-valkey-cluster-scripts
        name: scripts
      - configMap:
          defaultMode: 420
          name: gitea-valkey-cluster-default
        name: default-config
      - emptyDir: {}
        name: empty-dir
  updateStrategy:
    rollingUpdate:
      partition: 3
    type: RollingUpdate
  volumeClaimTemplates:
  - metadata:
      name: valkey-data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
