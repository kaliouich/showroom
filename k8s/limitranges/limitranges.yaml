# Valeurs de ressources par defaut, appliquees aux conteneurs qui n'en
# declarent pas. Les limites memoire valent environ 3x le pic observe le
# 2026-08-08, pour proteger le noeud sans risquer d'OOMKill au redemarrage.
#
# Attention : un LimitRange ne s'applique qu'aux pods CREES ensuite. Les pods
# deja en cours gardent leur configuration jusqu'a leur prochain redemarrage.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: monitoring
spec:
  limits:
    - type: Container
      defaultRequest: { memory: 512Mi, cpu: 50m }
      default: { memory: 3Gi, cpu: "2" }
---
