# Valeurs de ressources par defaut, appliquees aux conteneurs qui n'en
# declarent pas. Les limites memoire valent environ 3x le pic observe le
# 2026-08-08, pour proteger le noeud sans risquer d'OOMKill au redemarrage.
#
# Attention : un LimitRange ne s'applique qu'aux pods CREES ensuite. Les pods
# deja en cours gardent leur configuration jusqu'a leur prochain redemarrage.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: monitoring
spec:
  limits:
    - type: Container
      # 64Mi / 10m depuis le 2026-10-26 (512Mi / 50m avant). Seize conteneurs
      # sans requests explicites (proxys Linkerd, config-reloader, sidecars Grafana,
      # kube-state-metrics, node-exporter, promtail) reservaient 8 Gio et 800 m
      # pour quelques dizaines de Mio utilises. La limite (3Gi) ne change pas.
      defaultRequest: { memory: 64Mi, cpu: 10m }
      default: { memory: 3Gi, cpu: "2" }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: argocd
spec:
  limits:
    - type: Container
      # 96Mi / 10m depuis le 2026-10-26 (256Mi / 25m avant) : sept conteneurs sans
      # requests explicites en reservaient 1,8 Gio pour 20 a 120 Mio utilises. Le
      # application-controller (725 Mio au pic) a ses requests explicites.
      defaultRequest: { memory: 96Mi, cpu: 10m }
      default: { memory: 1536Mi, cpu: "1" }
---
