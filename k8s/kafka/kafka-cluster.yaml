# Cluster Kafka du showroom, pilote par l'operateur Strimzi (installe par
# Helm, voir infra/ansible/roles/platform). Mode KRaft : pas de ZooKeeper, les
# trois noeuds portent a la fois le role controller et le role broker.
#
# Honnetete sur ce que cette topologie prouve : les trois brokers tournent sur
# la meme VM. La replication (RF=3, min.insync.replicas=2) et le rolling
# restart orchestre par l'operateur tolerent la perte d'un *processus*, pas
# celle du noeud. Le stockage est un PVC local-path, donc des donnees sur le
# disque de la VM, sauvegardees avec elle (voir scripts/backup-cluster.sh).
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: showroom
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        class: local-path
        # Une suppression accidentelle du CR ne doit pas detruire les donnees.
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests:
      memory: 768Mi
      # Reservation, pas consommation : le nœud est plein en requêtes CPU alors
      # que l'usage réel tourne autour de 55 %. Un broker au repos consomme
      # quelques millicores.
      cpu: 50m
    limits:
      memory: 1Gi
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: showroom
  namespace: kafka
spec:
  kafka:
    version: 4.3.1
    listeners:
      # Un seul listener, chiffre (TLS) et authentifie (SCRAM-SHA-512). Les
      # identifiants des applications sont des KafkaUser, donc des CR dans Git.
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
    metricsConfig:
      type: strimziMetricsReporter
      values:
        allowList:
          - "kafka_server_.*"
          - "kafka_controller_.*"
          - "kafka_network_.*"
          - "kafka_log_.*"
          - "kafka_server_replicamanager_.*"
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Expose le lag des consumer groups et l'etat des topics, que les metriques
  # des brokers ne donnent pas.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        memory: 64Mi
        cpu: 10m
      limits:
        memory: 128Mi
