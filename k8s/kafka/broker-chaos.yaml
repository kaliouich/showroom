# Bouton « tuer un broker » de la section Event streaming du site. Le site reste
# en lecture seule sur Kubernetes : ce service est le seul a pouvoir supprimer des
# pods dans le namespace kafka, et seulement les trois brokers (droit « delete »
# limite par nom). Il refuse d'agir si le cluster n'est pas entierement sain,
# attend 10 minutes entre deux tirs, et n'accepte que les appels du site.
#
# Image construite sur le noeud :
#   sudo nerdctl --address /run/k3s/containerd/containerd.sock --namespace k8s.io \
#     build -t broker-chaos:v1 kafka-apps/broker-chaos
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: broker-chaos
  namespace: kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: broker-chaos
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
    resourceNames: [showroom-dual-role-0, showroom-dual-role-1, showroom-dual-role-2]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: broker-chaos
  namespace: kafka
subjects:
  - kind: ServiceAccount
    name: broker-chaos
    namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: broker-chaos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker-chaos
  namespace: kafka
  labels:
    app: broker-chaos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker-chaos
  template:
    metadata:
      labels:
        app: broker-chaos
    spec:
      serviceAccountName: broker-chaos
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker-chaos
          image: broker-chaos:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet: { path: /healthz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: broker-chaos
  namespace: kafka
spec:
  selector:
    app: broker-chaos
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: broker-chaos-ingress
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      app: broker-chaos
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: showcase
          podSelector:
            matchLabels:
              app: showcase-website
      ports:
        - { protocol: TCP, port: 8080 }
