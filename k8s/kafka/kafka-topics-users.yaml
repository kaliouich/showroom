# Topics et utilisateurs declares en code. Les operateurs Topic et User de
# Strimzi reconcilient ces CR vers le cluster : creer un topic ou accorder un
# droit passe par un commit, pas par une commande kafka-topics.sh.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: tamagotchi.events
  namespace: kafka
  labels:
    strimzi.io/cluster: showroom
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000   # 7 jours
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: tamagotchi-producer
  namespace: kafka
  labels:
    strimzi.io/cluster: showroom
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: tamagotchi.events, patternType: literal }
        operations: [Describe, Write]
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: tamagotchi-consumer
  namespace: kafka
  labels:
    strimzi.io/cluster: showroom
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: tamagotchi.events, patternType: literal }
        operations: [Describe, Read]
      - resource: { type: group, name: event-feed, patternType: literal }
        operations: [Read]
