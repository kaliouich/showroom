        {
          "type": "table",
          "title": "🔴 Images to upgrade first: Critical CVEs per image",
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "expr": "sort_desc(topk(15, sum by (namespace, image_repository, image_tag)(trivy_image_vulnerabilities{severity=\"Critical\"}) > 0))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "image_repository": "Image",
                  "image_tag": "Tag",
                  "namespace": "Namespace",
                  "Value": "Count"
                }
              }
            }
          ],
          "options": {
            "showHeader": true
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Count"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "continuous-GrYlRd"
                    }
                  },
                  {
                    "id": "min",
                    "value": 0
                  }
                ]
