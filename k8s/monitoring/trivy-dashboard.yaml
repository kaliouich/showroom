# Dashboard Grafana des rapports Trivy (vulnerabilites, mauvaises configurations, secrets
# exposes, RBAC, conformite). Memes mecanismes que les autres : le sidecar de
# kube-prometheus-stack decouvre tout ConfigMap portant grafana_dashboard: "1".
# Les series viennent du ServiceMonitor du trivy-operator (infra/ansible, role platform).
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  trivy-security.json: |
    {
      "uid": "trivy-security",
      "title": "🛡️ Security — Trivy Scan Results",
      "tags": [
        "trivy",
        "security",
        "devsecops"
      ],
      "timezone": "browser",
      "schemaVersion": 30,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "panels": [
        {
          "type": "text",
          "title": "How to read this board",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**What it is.** The Trivy operator rescans every workload once every 24 h (one scan at a time) and publishes the results as metrics.\n\n- **Vulnerabilities**: known CVEs in the image packages that have a fix available (unfixed ones are ignored). *Critical/High on a public-facing image* come first; the same CVE repeated in 10 pods of one image counts 10 times, so read the **image table** to know what to upgrade, not the grand total.\n- **Misconfigurations**: Kubernetes manifest weaknesses (no `readOnlyRootFilesystem`, root user, missing limits...). Most are expected on third-party charts; fix the ones on your own workloads.\n- **Exposed secrets**: credentials found inside an image layer. Anything above 0 is an incident: the alert `TrivyExposedSecrets` fires after 1 h.\n- **RBAC**: roles granting more than needed. **Compliance**: pass/fail count against CIS, NSA and Pod Security Standards.\n\nReports in raw form: `kubectl get vulnerabilityreports,configauditreports -A`. Summary script: `scripts/trivy-summary.sh`."
          },
          "id": 1
        },
        {
          "type": "stat",
          "title": "🔴 Critical CVEs",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "expr": "sum(trivy_image_vulnerabilities{severity=\"Critical\"})",
              "format": "time_series",
              "instant": true
            }
          ],
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              },
              "noValue": "0"
            }
          },
          "id": 2
        },
        {
          "type": "stat",
          "title": "🟠 High CVEs",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 6
          },
          "targets": [
            {
              "expr": "sum(trivy_image_vulnerabilities{severity=\"High\"})",
