apiVersion: v1
kind: Namespace
metadata:
  name: uptime-kuma
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-pvc
  namespace: uptime-kuma
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  replicas: 1
  # Recreate : la base SQLite n'admet qu'un seul pod a la fois.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
        - name: uptime-kuma
          # 1.x n'est plus publie (derniere : 1.23.17, 15 CVE critiques selon Trivy). Passage a la
          # 2.x le 2026-10-29 apres copie du volume ; la base est migree au premier demarrage et
          # ne revient pas en arriere sans cette copie.
          image: louislam/uptime-kuma:2.5.8
          env:
            - { name: UPTIME_KUMA_DB_TYPE, value: sqlite }
          ports:
            - containerPort: 3001
          volumeMounts:
            - mountPath: /app/data
              name: kuma-data
      volumes:
        - name: kuma-data
          persistentVolumeClaim:
            claimName: uptime-kuma-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  selector:
    app: uptime-kuma
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma-route
  namespace: uptime-kuma
spec:
  parentRefs:
  - name: main-gateway
    namespace: default
  hostnames:
  - "status.khalilaliouich.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: uptime-kuma
      port: 80
