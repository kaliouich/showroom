# Base PostgreSQL du Tamagotchi, geree par l'operateur CloudNativePG (installe par le role
# Ansible platform, namespace cnpg-system) : 1 primaire + 2 replicas, bascule automatique.
#
# Identifiants : le role applicatif "tamagotchi" et son mot de passe sont generes par
# l'operateur dans le Secret tamagotchi-db-app, que l'API lit.
#
# Sans stockage objet : pas d'archivage de WAL, donc pas de restauration a un instant precis.
# Les sauvegardes restent le pg_dump nocturne de scripts/backup-cluster.sh. Ajouter le plugin
# Barman Cloud plus tard ne demande qu'un redemarrage progressif des pods.
#
# Prune=false : si ce fichier disparaissait de Git, ArgoCD supprimerait la base, et avec elle ses
# volumes (la classe local-path a une reclaimPolicy Delete).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tamagotchi-db
  namespace: tamagotchi
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 3
  # Variante trixie (Debian 13) : le tag nu 17.11 reste sur bullseye, dont le projet a arrete le
  # support. "standard" embarque les outils de sauvegarde ; arm64 disponible.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie

  # Comme gitea-pg : le proxy Linkerd a deja reinitialise des connexions vers le 5432, et la
  # replication ouvre ses propres connexions entre les pods.
  inheritedMetadata:
    annotations:
      linkerd.io/inject: disabled

  # Amorcage a vide : le role applicatif et la base sont crees, le schema par l'API au demarrage
  # (CREATE TABLE IF NOT EXISTS). Au premier demarrage de cette base, le 2026-11-23, les donnees
  # venaient d'un import logique de l'ancien PostgreSQL (bootstrap.initdb.import), supprime depuis.
  # Apres un sinistre, on restaure le dernier pg_dump (infra/bootstrap/restore-from-backup.sh).
  bootstrap:
    initdb:
      database: tamagotchi
      owner: tamagotchi

  postgresql:
    # local-path n'applique pas la taille des volumes : tout ce qu'ecrit PostgreSQL va sur le disque
    # du noeud, partage avec tout le reste. Les slots de replication de haute disponibilite
    # (CloudNativePG les cree par defaut) retiennent le WAL tant qu'un replica ne l'a pas lu ; sans
    # plafond, un replica a l'arret ferait grossir le WAL du primaire jusqu'a remplir le disque.
    # Au-dela de 1 Go de retard, le slot est invalide et le replica est reconstruit.
    parameters:
      max_slot_wal_keep_size: "1GB"
    # Un replica synchrone au moins : une ecriture validee existe sur deux pods.
    synchronous:
      method: any
      number: 1
      dataDurability: required

  # local-path ne sait pas agrandir un volume : on voit large (la base fait 7 Mo).
  storage:
    storageClass: local-path
    size: 5Gi
  walStorage:
    storageClass: local-path
    size: 2Gi

  # Memoire limitee = demandee : l'instance n'est jamais tuee par la pression du noeud
  # avant les autres. Le CPU peut exploser jusqu'a un coeur.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 512Mi
