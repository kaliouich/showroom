# Metriques des instances PostgreSQL (port "metrics", 9187). Le champ
# spec.monitoring.enablePodMonitor du Cluster est deprecie : on declare le PodMonitor.
# Le label release: kube-prometheus est celui que selectionne notre Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tamagotchi-db
  namespace: tamagotchi
  labels:
    release: kube-prometheus
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: tamagotchi-db
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
