# Meme mecanisme que tamagotchi-dashboard.yaml et loki-dashboard-cm.yaml : le
# sidecar Grafana de kube-prometheus-stack decouvre tout ConfigMap portant
# grafana_dashboard: "1", quel que soit le namespace (ruleNamespaceSelector
# vide, verifie en direct). Aucune config Grafana supplementaire necessaire.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tamagotchi-slo-dashboard
  namespace: tamagotchi
  labels:
    grafana_dashboard: "1"
data:
  tamagotchi-slo.json: |
    {
      "uid": "tamagotchi-slo",
      "title": "📈 Tamagotchi SLO & Error Budget",
      "tags": [ "tamagotchi", "slo", "demo" ],
      "timezone": "browser",
      "schemaVersion": 30,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "🎯 30-Day Availability",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "tamagotchi:availability:ratio30d * 100", "format": "time_series" }],
          "options": { "graphMode": "area", "colorMode": "value", "justifyMode": "auto", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 99 },
                  { "color": "green", "value": 99.9 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "🎯 SLO Target",
          "gridPos": { "h": 6, "w": 4, "x": 6, "y": 0 },
          "targets": [{ "expr": "tamagotchi:slo_target:ratio * 100", "format": "time_series" }],
          "options": { "graphMode": "none", "colorMode": "none", "justifyMode": "auto", "textMode": "auto" },
          "fieldConfig": {
            "defaults": { "unit": "percent", "decimals": 1 }
          }
        },
        {
          "type": "stat",
          "title": "🔥 Error Budget Consumed (30d)",
          "gridPos": { "h": 6, "w": 6, "x": 10, "y": 0 },
          "targets": [{ "expr": "tamagotchi:error_budget:consumed_ratio30d * 100", "format": "time_series" }],
          "options": { "graphMode": "area", "colorMode": "value", "justifyMode": "auto", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "max": 200,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 100 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "⏱️ P95 Latency",
          "gridPos": { "h": 6, "w": 4, "x": 16, "y": 0 },
          "targets": [{ "expr": "tamagotchi:http_request_duration_seconds:p95_5m * 1000", "format": "time_series" }],
          "options": { "graphMode": "area", "colorMode": "value", "justifyMode": "auto", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "decimals": 0,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 200 },
                  { "color": "red", "value": 500 }
                ]
              }
            }
          }
        },
        {
          "type": "stat",
          "title": "⏱️ P99 Latency",
          "gridPos": { "h": 6, "w": 4, "x": 20, "y": 0 },
          "targets": [{ "expr": "tamagotchi:http_request_duration_seconds:p99_5m * 1000", "format": "time_series" }],
          "options": { "graphMode": "area", "colorMode": "value", "justifyMode": "auto", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "decimals": 0,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 500 },
                  { "color": "red", "value": 1000 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "🔢 tamagotchi-api Replicas — this is what the Chaos Button shakes",
          "gridPos": { "h": 8, "w": 10, "x": 0, "y": 6 },
          "targets": [
            { "expr": "kube_deployment_status_replicas_ready{namespace=\"tamagotchi\", deployment=\"tamagotchi-api\"}", "legendFormat": "Ready" },
            { "expr": "kube_deployment_spec_replicas{namespace=\"tamagotchi\", deployment=\"tamagotchi-api\"}", "legendFormat": "Desired" }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 3,
              "decimals": 0,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "fillOpacity": 15,
                "gradientMode": "opacity"
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "📈 Availability Trend — same window, nothing moves when a pod dies",
          "gridPos": { "h": 8, "w": 14, "x": 10, "y": 6 },
          "targets": [
            { "expr": "tamagotchi:availability:ratio1h * 100", "legendFormat": "1h rolling" },
            { "expr": "tamagotchi:availability:ratio6h * 100", "legendFormat": "6h rolling" }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 95,
              "max": 100,
              "decimals": 2,
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "gradientMode": "opacity"
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "🚦 Request Rate by Status Code",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "targets": [
            { "expr": "tamagotchi:http_requests_total:rate5m", "legendFormat": "{{status_code}}" }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20,
                "gradientMode": "opacity",
                "stacking": { "mode": "normal" }
              }
            }
          }
        },
        {
          "type": "gauge",
          "title": "💸 Error Budget Remaining (30d, at 99.9% SLO)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "targets": [
            { "expr": "(1 - tamagotchi:error_budget:consumed_ratio30d) * 100", "format": "time_series" }
          ],
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"] },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "decimals": 1,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0 },
                  { "color": "green", "value": 50 }
                ]
              }
            }
          }
        }
      ]
    }
