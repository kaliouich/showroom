# Garde la demo vivante.
#
# Sans intervention, les creatures ont faim, perdent leur bonheur et finissent
# par mourir : un visiteur arrivant sur la vitrine tombait sur un cimetiere,
# et les dashboards Grafana affichaient des courbes plates.
#
# Ce CronJob ranime les mortes et joue quelques actions au hasard. Effet
# secondaire recherche : les compteurs Prometheus (feed/play/sleep) et les
# jauges hunger/happiness/energy bougent en permanence, ce qui rend les
# graphiques lisibles a n'importe quelle heure.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tamagotchi-keepalive
  namespace: tamagotchi
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          annotations:
            # Un Job ne se termine jamais si le proxy Linkerd reste en vie
            # apres le conteneur principal : le pod resterait NotReady
            # indefiniment et le CronJob finirait par se bloquer.
            linkerd.io/inject: disabled
        spec:
          restartPolicy: OnFailure
          containers:
            - name: keepalive
              image: alpine:3.20
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  apk add --no-cache curl jq >/dev/null 2>&1
                  API="http://tamagotchi-api.tamagotchi.svc.cluster.local:8080/api"

                  creatures=$(curl -fsS "$API/creatures")
                  total=$(echo "$creatures" | jq 'length')
                  echo "creatures: $total"

                  # 1. Ranimer tout ce qui est mort.
                  dead=$(echo "$creatures" | jq -r '.[] | select(.is_alive == false) | .id')
                  for id in $dead; do
                    curl -fsS -X POST "$API/creatures/$id/revive" >/dev/null && echo "revive $id"
                  done

                  # 2. Nourrir celles qui ont faim, distraire celles qui s'ennuient.
                  hungry=$(echo "$creatures" | jq -r '.[] | select(.hunger > 50) | .id')
                  for id in $hungry; do
                    curl -fsS -X POST "$API/creatures/$id/feed" >/dev/null && echo "feed $id"
                  done

                  sad=$(echo "$creatures" | jq -r '.[] | select(.happiness < 60) | .id')
                  for id in $sad; do
                    curl -fsS -X POST "$API/creatures/$id/play" >/dev/null && echo "play $id"
                  done

                  # 3. Une action au hasard, pour que les compteurs ne soient
                  #    pas parfaitement periodiques.
                  id=$(echo "$creatures" | jq -r '.[].id' | shuf -n 1)
                  action=$(printf 'feed\nplay\nsleep\n' | shuf -n 1)
                  curl -fsS -X POST "$API/creatures/$id/$action" >/dev/null && echo "random $action $id"

                  curl -fsS "$API/stats"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
