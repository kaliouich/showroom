# PostgreSQL de Gitea, image officielle.
#
# Avant le 2026-10-29 la base venait du sous-chart Bitnami (image "bitnamilegacy/postgresql",
# archivee : plus aucun correctif, 16 CVE critiques et 83 hautes selon Trivy). Les donnees ont
# ete migrees par pg_dump / psql (base de 17 Mo). Le mot de passe vit dans le secret
# gitea-pg-credentials (cle "password"), cree hors du depot par le role Ansible platform.
#
# Linkerd : pod non maille. Le proxy cote serveur reinitialisait les connexions vers 5432
# (voir le commentaire de k8s/gitea/values.yaml) ; le trafic reste dans le namespace et la
# NetworkPolicy default-egress le limite deja.
apiVersion: v1
kind: Service
metadata:
  name: gitea-pg
  namespace: gitea
spec:
  selector:
    app: gitea-pg
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea-pg
  namespace: gitea
spec:
  serviceName: gitea-pg
  replicas: 1
  selector:
    matchLabels:
      app: gitea-pg
  template:
    metadata:
      labels:
        app: gitea-pg
      annotations:
        linkerd.io/inject: disabled
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: gitea }
            - { name: POSTGRES_DB, value: gitea }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: gitea-pg-credentials, key: password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: [pg_isready, -U, gitea, -d, gitea] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, gitea, -d, gitea] }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          # Meme dimensionnement que l'ancienne base (p95 : 7 m de CPU, 87 Mio) ;
          # la limite de memoire monte de 192 a 256 Mio pour garder de la marge.
          resources:
            requests: { cpu: 25m, memory: 128Mi, ephemeral-storage: 50Mi }
            limits: { cpu: 150m, memory: 256Mi, ephemeral-storage: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
