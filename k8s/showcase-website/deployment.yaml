apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: showcase-website
  name: showcase-website
  namespace: showcase
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: showcase-website
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-07-05T17:45:37Z'
      labels:
        app: showcase-website
    spec:
      containers:
      - env:
        - name: PROMETHEUS_URL
          value: http://kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090
        - name: PUBLIC_NAMESPACES
          value: '*'
        image: showcase-website:v59
        imagePullPolicy: Never
        name: website
        ports:
        - containerPort: 3000
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: showcase-sa
      serviceAccountName: showcase-sa
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: tmp

