# Gateway unique, ClusterIssuer Let's Encrypt et certificat generique.
# __DOMAIN__ et __ACME_EMAIL__ sont substitues par install-platform.sh.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# Dimensionnement du proxy Envoy de la passerelle. Les valeurs par defaut d'Envoy Gateway
# (100 m, 512 Mio) reservaient dix fois l'usage mesure sur 7 jours : 46 Mio et 2 m de CPU.
# La limite memoire reste a 512 Mio pour absorber un pic de connexions.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: main-gateway-proxy
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: main-gateway-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.__DOMAIN__"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: khalilaliouich-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: __ACME_EMAIL__
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # Le challenge HTTP-01 passe par la Gateway : c'est pour cela que le
      # DNS doit deja pointer sur l'IP reservee avant de lancer ce script,
      # sinon Let's Encrypt echoue et le certificat ne sera jamais emis.
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: main-gateway
                namespace: default
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: khalilaliouich-tls
  namespace: default
spec:
  secretName: khalilaliouich-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  # Cle neuve a chaque renouvellement plutot que la meme reconduite : une cle
  # privee a deja fuite depuis ce depot public, autant limiter sa duree de vie.
  privateKey:
    rotationPolicy: Always
  duration: 2160h # 90 jours (defaut Let's Encrypt, explicite ici)
  renewBefore: 720h # renouvellement a J-30
  dnsNames:
    - "__DOMAIN__"
    - "www.__DOMAIN__"
    - "git.__DOMAIN__"
    - "argocd.__DOMAIN__"
    - "grafana.__DOMAIN__"
    - "prometheus.__DOMAIN__"
    - "demo.__DOMAIN__"
    - "status.__DOMAIN__"
    - "n8n.__DOMAIN__"
    - "linkerd.__DOMAIN__"
    - "habits.__DOMAIN__"
    - "showcase.__DOMAIN__"
