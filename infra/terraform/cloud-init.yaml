#cloud-config
# Amorce minimale : juste de quoi permettre a "ansible-playbook site.yml" de
# tourner. Paquets, pare-feu et k3s appartenaient ici avant, en double avec
# les roles Ansible base/k3s — exactement le probleme a eviter : deux
# endroits a tenir a jour pour la meme chose (version de k3s, regles
# iptables...). Ce fichier ne possede plus que ce qui vient reellement de
# Terraform : les variables du plan (domain, acme_email, backup_bucket) et
# le point d'entree vers le depot.

package_update: true
package_upgrade: false

packages:
  - git
  - ansible

write_files:
  # Seul consommateur : les scripts shell (backup-cluster.sh et le chemin de
  # secours install-platform.sh / restore-from-backup.sh), qui ne tournent
  # pas sous Ansible et ont besoin de ces valeurs sur disque. Les roles
  # Ansible utilisent directement group_vars/all.yml, ils ne relisent pas ce
  # fichier.
  - path: /etc/showroom.env
    permissions: "0644"
    content: |
      DOMAIN=${domain}
      ACME_EMAIL=${acme_email}
      BACKUP_BUCKET=${backup_bucket}

runcmd:
  - exec > /var/log/bootstrap.log 2>&1
  - set -x

  - git clone ${repo_url} /opt/showroom || true
  - chmod +x /opt/showroom/infra/bootstrap/*.sh /opt/showroom/scripts/*.sh || true

  - |
    echo "=== Depot clone. Suite (voir infra/DISASTER-RECOVERY.md) : ==="
    echo "    cd /opt/showroom/infra/ansible"
    echo "    ansible-galaxy collection install -r requirements.yml"
    echo "    sudo ansible-playbook -i localhost, -c local site.yml"

final_message: "Noeud amorce en $UPTIME s. Voir /var/log/bootstrap.log"
