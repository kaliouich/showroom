---
domain: khalilaliouich.com
acme_email: khalil.aliouich@gmail.com
repo_root: /opt/showroom
kubeconfig: /etc/rancher/k3s/k3s.yaml
backup_bucket: showroom-backups

# Versions figees, relevees en production le 2026-08-10. Une reprise
# d'incident n'est pas le moment de decouvrir qu'un chart a change de schema.
versions:
  k3s: v1.36.2+k3s1
  gateway_api: v1.2.1
  # renovate: datasource=helm depName=cert-manager registryUrl=https://charts.jetstack.io
  cert_manager: v1.20.3
  envoy_gateway: 1.8.2
  # renovate: datasource=helm depName=kube-prometheus-stack registryUrl=https://prometheus-community.github.io/helm-charts
  kube_prom: 87.10.1
  loki: 2.10.3
  trivy: 0.33.2
  # Chart 12.7.0 (appVersion 1.27.0) ; l'image est forcee a 28.2.0 dans
  # k8s/gitea/values.yaml. Voir TECHNICAL_ISSUES_RESOLVED.md, incident 12.
  # renovate: datasource=helm depName=gitea registryUrl=https://dl.gitea.com/charts/
  gitea: 12.7.0
  argocd: v3.4.12
  # renovate: datasource=helm depName=strimzi-kafka-operator registryUrl=https://strimzi.io/charts/
  strimzi: 1.3.0
  linkerd_edge: edge-26.6.3

# ---------------------------------------------------------------------------
# Valeurs Helm.
#
# Elles vivaient jusqu'ici dans l'etat des releases, invisibles et non
# versionnees. Trois residus y trainaient : le mot de passe admin en clair, un
# fournisseur OIDC Authelia demantele depuis, et des hotes nip.io d'une epoque
# ou l'entree se faisait par nginx.
# ---------------------------------------------------------------------------

grafana_admin_user: admin

kube_prometheus_values:
  grafana:
    enabled: true
    # Le mot de passe n'est plus ici : il vient du secret existant, lui-meme
    # hors du depot. Grafana ne lit cette valeur qu'a la toute premiere
    # installation, ensuite le mot de passe vit dans sa propre base.
    admin:
      existingSecret: grafana-admin-credentials
      userKey: admin-user
      passwordKey: admin-password
    assertNoLeakedSecrets: false
    persistence:
      enabled: true
      existingClaim: grafana-pvc
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi
    grafana.ini:
      server:
        root_url: https://grafana.khalilaliouich.com
      # Les dashboards sont embarques en iframe sur le site : sans lecture
      # anonyme ni autorisation d'embarquement, un visiteur ne verrait rien.
      auth.anonymous:
        enabled: true
        org_role: Viewer
      security:
        allow_embedding: true
  # 174 000 series actives le 2026-10-29, dont 39 000 d'histogrammes de l'API Kubernetes
  # qu'aucune regle ni aucun tableau de bord de la vitrine n'utilise : le volume de 15 Gio
  # etait plein (retentionSize atteint). On garde les deux familles lues par les regles
  # kube-apiserver (apiserver_request_duration/sli). Le premier element reprend la valeur
  # par defaut du chart, qu'une liste personnalisee remplace.
  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__, le]
          regex: "(etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\\.15|0\\.2|0\\.3|0\\.35|0\\.4|0\\.45|0\\.6|0\\.7|0\\.8|0\\.9|1\\.25|1\\.5|1\\.75|2|3|3\\.5|4|4\\.5|6|7|8|9|15|20|40|45|50)(\\.0)?"
        - action: drop
          sourceLabels: [__name__]
          regex: "(etcd_request_duration_seconds_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket)"
  # Sur k3s, le kubelet expose aussi le registre de l'API Kubernetes (tout tourne dans un seul
  # processus) : ces memes histogrammes y sont scrutes une seconde fois, ~60 000 series qui
  # doublent celles du job apiserver. Le premier element est la valeur par defaut du chart.
  kubelet:
    serviceMonitor:
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__, le]
          regex: "(csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\\.0)?"
        - action: drop
          sourceLabels: [__name__]
          regex: "(apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|etcd_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_response_sizes_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket|workqueue_work_duration_seconds_bucket|workqueue_queue_duration_seconds_bucket)"
  prometheus:
    prometheusSpec:
      # Jusqu'ici sans storageSpec : le chart fait alors tourner Prometheus sur
      # un emptyDir, donc la retention ci-dessous ne valait que jusqu'au
      # prochain redemarrage du pod. Meme classe de bug que Grafana et
      # Valkey/Gitea (voir issues.html, incidents 7 et le RUNBOOK-valkey) —
      # une charge avec etat sur du stockage ephemere. Le SLO board a besoin
      # d'un historique qui survit reellement 30 jours, donc PVC ici aussi.
      retention: 30d
      # Coupe-circuit si la retention temporelle ne suffit pas a purger assez
      # vite : Prometheus efface les blocs les plus anciens pour rester sous
      # ce volume plutot que de remplir le disque du noeud.
      retentionSize: 14GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ['ReadWriteOnce']
            resources:
              requests:
                storage: 15Gi
      # Mesure sur 7 jours : 2,2 Gio de pic pour ~250 000 series. La demande etait de
      # 512 Mio (premier pod evince en cas de pression memoire) et la limite de 3 Gio
      # ne laissait que 800 Mio de marge pour le rejeu du WAL au demarrage.
      resources:
        limits:
          memory: 4Gi
        requests:
          cpu: 150m
          memory: 2400Mi

# Les valeurs Helm de Gitea vivent dans k8s/gitea/values.yaml (source unique,
# lue par le role platform) : elles sont versionnees avec le reste du durcissement.
