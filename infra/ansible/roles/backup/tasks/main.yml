---
- name: Script de sauvegarde
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/backup-cluster.sh"
    dest: /usr/local/bin/backup-cluster.sh
    mode: "0755"
    remote_src: true

# /etc/showroom.env est ecrit une fois par cloud-init (infra/terraform/cloud-init.yaml),
# a partir des variables du plan Terraform. Le reecrire ici en double aurait ete
# exactement le probleme inverse : deux endroits pour la meme donnee, cette
# fois-ci a l'envers (Ansible dupliquant Terraform). backup-cluster.sh continue
# de le lire tel quel.

- name: Unite systemd
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/k3s-backup.service"
    dest: /etc/systemd/system/k3s-backup.service
    remote_src: true
  notify: reload systemd

- name: Timer systemd
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/k3s-backup.timer"
    dest: /etc/systemd/system/k3s-backup.timer
    remote_src: true
  notify: reload systemd

- name: Activer le timer
  ansible.builtin.systemd:
    name: k3s-backup.timer
    enabled: true
    state: started
    daemon_reload: true
