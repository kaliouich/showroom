---
# ---------------------------------------------------------------------------
# Socle : Gateway API, cert-manager, Envoy Gateway.
# ---------------------------------------------------------------------------

- name: CRD Gateway API
  kubernetes.core.k8s:
    src: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ versions.gateway_api }}/standard-install.yaml"
    state: present
    kubeconfig: "{{ kubeconfig }}"

- name: Depots Helm
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
  loop:
    - { name: jetstack, url: "https://charts.jetstack.io" }
    - { name: gitea-charts, url: "https://dl.gitea.com/charts/" }
    - { name: prometheus-community, url: "https://prometheus-community.github.io/helm-charts" }
    - { name: grafana, url: "https://grafana.github.io/helm-charts" }
    - { name: aqua, url: "https://aquasecurity.github.io/helm-charts/" }
    - { name: strimzi, url: "https://strimzi.io/charts/" }

- name: Installer cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ versions.cert_manager }}"
    release_namespace: cert-manager
    create_namespace: true
    wait: true
    kubeconfig: "{{ kubeconfig }}"
    values:
      crds:
        enabled: true

- name: Envoy Gateway
  kubernetes.core.helm:
    name: eg
    chart_ref: oci://docker.io/envoyproxy/gateway-helm
    chart_version: "v{{ versions.envoy_gateway }}"
    release_namespace: envoy-gateway-system
    create_namespace: true
    wait: true
    kubeconfig: "{{ kubeconfig }}"

- name: Gateway, ClusterIssuer et certificat
  kubernetes.core.k8s:
    definition: "{{ lookup('template', repo_root + '/infra/bootstrap/manifests/gateway.yaml') |
      replace('__DOMAIN__', domain) | replace('__ACME_EMAIL__', acme_email) | from_yaml_all | list }}"
    state: present
    kubeconfig: "{{ kubeconfig }}"

# ---------------------------------------------------------------------------
# Service mesh, puis GitOps.
# ---------------------------------------------------------------------------

- name: Linkerd installe ?
  kubernetes.core.k8s_info:
    kind: Namespace
    name: linkerd
    kubeconfig: "{{ kubeconfig }}"
  register: linkerd_ns

- name: Installer Linkerd
  ansible.builtin.shell: |
    set -eo pipefail
    export PATH="$PATH:$HOME/.linkerd2/bin"
    command -v linkerd >/dev/null || curl -sL https://run.linkerd.io/install-edge | sh
    linkerd install --crds | kubectl apply -f -
    linkerd install | kubectl apply -f -
    linkerd check --wait 5m || true
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  when: linkerd_ns.resources | length == 0
  changed_when: true

# ArgoCD fait transiter du gRPC entre son serveur, son repo-server et son
# application-controller. Le proxy Linkerd l'intercepte et casse les
# handshakes TLS, rendant ArgoCD inaccessible. Le namespace doit donc porter
# l'exclusion AVANT qu'ArgoCD n'existe.
- name: Namespace ArgoCD, exclu du maillage
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd
        annotations:
          linkerd.io/inject: disabled

- name: ArgoCD
  kubernetes.core.k8s:
    src: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ versions.argocd }}/manifests/install.yaml"
    namespace: argocd
    state: present
    kubeconfig: "{{ kubeconfig }}"

- name: Attendre ArgoCD
  ansible.builtin.command: kubectl -n argocd rollout status deploy/argocd-server --timeout=900s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false

- name: Configuration ArgoCD — compte invite, URL, lecture seule par defaut
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: patched
    kind: ConfigMap
    namespace: argocd
    name: "{{ item.name }}"
    definition:
      data: "{{ item.data }}"
  loop:
    - name: argocd-cm
      data:
        accounts.guest: login
        url: "https://argocd.{{ domain }}"
    - name: argocd-rbac-cm
      data:
        policy.default: role:readonly

- name: Applications ArgoCD
  kubernetes.core.k8s:
    src: "{{ repo_root }}/k8s/argocd/applications.yaml"
    state: present
    kubeconfig: "{{ kubeconfig }}"

# ---------------------------------------------------------------------------
# Observabilite, politiques, forge.
# ---------------------------------------------------------------------------

- name: Installer kube-prometheus-stack
  kubernetes.core.helm:
    name: kube-prometheus
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ versions.kube_prom }}"
    release_namespace: monitoring
    create_namespace: true
    wait: true
    timeout: 20m
    kubeconfig: "{{ kubeconfig }}"
    values: "{{ kube_prometheus_values }}"

- name: Loki
  kubernetes.core.helm:
    name: loki
    chart_ref: grafana/loki-stack
    chart_version: "{{ versions.loki }}"
    release_namespace: monitoring
    wait: true
    kubeconfig: "{{ kubeconfig }}"
    # Valeurs dans k8s/monitoring/loki-values.yaml (persistance, retention 14 jours,
    # requests). Le stockage etait un emptyDir : recreer le pod effacait les journaux.
    values: "{{ lookup('file', repo_root ~ '/k8s/monitoring/loki-values.yaml') | from_yaml }}"

- name: Trivy Operator
  kubernetes.core.helm:
    name: trivy-operator
    chart_ref: aqua/trivy-operator
    chart_version: "{{ versions.trivy }}"
    release_namespace: trivy-system
    create_namespace: true
    wait: true
    kubeconfig: "{{ kubeconfig }}"
    # Au demarrage l'operateur relance une dizaine de scans a la fois (charge 35-45 sur
    # 4 coeurs) : les sondes de Strimzi echouent et les brokers Kafka sont tues. Voir
    # k8s/RUNBOOK-ressources.md. Deux scans en parallele suffisent, ils prennent juste plus de temps.
    values:
      operator:
        scanJobsConcurrentLimit: 2

- name: Gitea
  kubernetes.core.helm:
    name: gitea
    chart_ref: gitea-charts/gitea
    chart_version: "{{ versions.gitea }}"
    release_namespace: gitea
    create_namespace: true
    wait: true
    timeout: 20m
    kubeconfig: "{{ kubeconfig }}"
    values: "{{ lookup('file', repo_root ~ '/k8s/gitea/values.yaml') | from_yaml }}"

# Durcissement de Gitea : filtrage des sorties du namespace et refus de
# /api/internal a la passerelle (voir ces fichiers pour le pourquoi).
- name: Durcissement Gitea (NetworkPolicy, filtre de la passerelle)
  kubernetes.core.k8s:
    src: "{{ item }}"
    state: present
    kubeconfig: "{{ kubeconfig }}"
  loop:
    - "{{ repo_root }}/k8s/gitea/networkpolicy.yaml"
    - "{{ repo_root }}/k8s/gitea/httproute-hardening.yaml"
    - "{{ repo_root }}/k8s/gitea/alerts.yaml"

# Operateur Strimzi : il ne surveille que le namespace kafka. Le cluster Kafka
# lui-meme (CR Kafka, KafkaNodePool, KafkaTopic, KafkaUser) est declare dans
# k8s/kafka/ et synchronise par l'Application ArgoCD "kafka".
- name: Strimzi (operateur Kafka)
  kubernetes.core.helm:
    name: strimzi
    chart_ref: strimzi/strimzi-kafka-operator
    chart_version: "{{ versions.strimzi }}"
    release_namespace: kafka
    create_namespace: true
    wait: true
    kubeconfig: "{{ kubeconfig }}"
    values:
      watchNamespaces:
        - kafka
      resources:
        requests:
          memory: 256Mi
          cpu: 50m
        limits:
          memory: 384Mi

- name: Limites de ressources par namespace
  kubernetes.core.k8s:
    src: "{{ repo_root }}/k8s/limitranges/limitranges.yaml"
    state: present
    kubeconfig: "{{ kubeconfig }}"
