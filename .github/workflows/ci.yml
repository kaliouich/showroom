# CI du showroom. Trois verifications independantes plutot qu'une seule
# grosse etape : un echec pointe directement vers la cause (secret, image,
# manifeste) au lieu d'un job monolithique a deplier pour savoir quoi a rate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Scan de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks a besoin de l'historique complet

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gitleaks inspecte le contenu des fichiers : une archive binaire lui est
      # opaque. C'est precisement ainsi qu'une cle privee TLS a fini publiee
      # dans ce depot (voir infra/DISASTER-RECOVERY.md). On refuse donc les
      # archives et le materiel cryptographique sur leur seule extension.
      - name: Refuser les archives et le materiel cryptographique
        run: |
          FOUND=$(git ls-files | grep -iE '\.(zip|tar|tar\.gz|tgz|key|pem|p12|pfx)$' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Fichiers interdits (archive ou cle) commites :"
            echo "$FOUND"
            exit 1
          fi
          echo "Aucune archive ni cle versionnee."

  build:
    name: Build & scan de l'image du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Installer les dependances
        working-directory: website
        run: npm ci

      - name: Audit des dependances
        working-directory: website
        run: npm audit --audit-level=high

      - name: Verifier la syntaxe du serveur
        working-directory: website
        run: node --check server.js

      - name: Construire l'image
        run: docker build -t showcase-website:${{ github.sha }} ./website

      - name: Trivy — vulnerabilites de l'image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: showcase-website:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  manifests:
    name: Validation des manifestes K8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          # -ignore-missing-schemas : les CRD (Gateway API, cert-manager,
          # Prometheus Operator, ArgoCD) n'ont pas de schema dans le catalogue
          # par defaut. Glob explicite sur .yaml/.yml : k8s/ contient aussi des
          # runbooks en Markdown que kubeconform n'a pas a essayer de parser.
          ./kubeconform -summary -ignore-missing-schemas -strict \
            $(find k8s infra/bootstrap/manifests -name '*.yaml' -o -name '*.yml')
