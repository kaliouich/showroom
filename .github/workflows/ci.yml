# CI du showroom. Cinq verifications independantes plutot qu'une seule
# grosse etape : un echec pointe directement vers la cause (secret, image,
# manifeste, Terraform, Ansible) au lieu d'un job monolithique a deplier pour
# savoir quoi a rate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Scan de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks a besoin de l'historique complet

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # gitleaks inspecte le contenu des fichiers : une archive binaire lui est
      # opaque. C'est precisement ainsi qu'une cle privee TLS a fini publiee
      # dans ce depot (voir infra/DISASTER-RECOVERY.md). On refuse donc les
      # archives et le materiel cryptographique sur leur seule extension.
      - name: Refuser les archives et le materiel cryptographique
        run: |
          FOUND=$(git ls-files | grep -iE '\.(zip|tar|tar\.gz|tgz|key|pem|p12|pfx)$' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Fichiers interdits (archive ou cle) commites :"
            echo "$FOUND"
            exit 1
          fi
          echo "Aucune archive ni cle versionnee."

  build:
    name: Build & scan de l'image du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Installer les dependances
        working-directory: website
        run: npm ci

      - name: Audit des dependances
        working-directory: website
        run: npm audit --audit-level=high

      - name: Verifier la syntaxe du serveur
        working-directory: website
        run: node --check server.js

      - name: Construire l'image
        run: docker build -t showcase-website:${{ github.sha }} ./website

      - name: Trivy — vulnerabilites de l'image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: showcase-website:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  manifests:
    name: Validation des manifestes K8s
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          # -ignore-missing-schemas : les CRD (Gateway API, cert-manager,
          # Prometheus Operator, ArgoCD) n'ont pas de schema dans le catalogue
          # par defaut. Glob explicite sur .yaml/.yml : k8s/ contient aussi des
          # runbooks en Markdown que kubeconform n'a pas a essayer de parser.
          ./kubeconform -summary -ignore-missing-schemas -strict \
            $(find k8s infra/bootstrap/manifests -name '*.yaml' -o -name '*.yml')

  terraform:
    name: Validation Terraform (infra/terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # -backend=false : aucun backend n'est configure (etat local, gitignore,
      # voir infra/DISASTER-RECOVERY.md). Le provider OCI se telecharge depuis
      # le registry public Terraform, sans le moindre identifiant.
      - name: terraform init (sans backend ni identifiants)
        run: terraform init -backend=false -input=false

      # validate ne resout jamais les data sources a distance (contrairement a
      # plan) : c'est ce qui permet de tourner sans identifiants OCI. Un vrai
      # `terraform plan` demanderait tenancy/user/fingerprint + cle privee en
      # secrets GitHub — hors scope ici : le runbook de reprise est explicite,
      # cette cle doit rester hors de ce serveur, donc hors CI tant que ca
      # n'a pas ete tranche explicitement.
      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint

  ansible:
    name: Lint Ansible (infra/ansible)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer ansible-lint et les collections
        run: |
          pip install ansible-lint
          ansible-galaxy collection install -r requirements.yml

      # Profil "basic" (voir .ansible-lint) : les 4 ecarts de nommage de
      # variables pre-existants sont geles dans .ansible-lint-ignore plutot
      # qu'ignores en bloc — une nouvelle occurrence ailleurs reste bloquante.
      - name: ansible-lint
        run: ansible-lint site.yml

      # --syntax-check n'ouvre aucune connexion reseau : inventory.ini garde
      # volontairement un hote CHANGEME, ce job ne cible jamais de machine
      # reelle.
      - name: Verification syntaxique du playbook
        run: ansible-playbook -i inventory.ini site.yml --syntax-check
