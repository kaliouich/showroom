apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-route
  namespace: gitea
spec:
  parentRefs:
  - name: main-gateway
    namespace: default
  hostnames:
  - "git.khalilaliouich.com"
  rules:
  # Jamais d'API interne depuis Internet (voir k8s/gitea/httproute-hardening.yaml).
  - matches:
    - path:
        type: PathPrefix
        value: /api/internal
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: deny-internal
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gitea-http
      port: 3000
---
